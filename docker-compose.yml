services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cuny_scouter
      POSTGRES_USER: scouter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scouter}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scouter -d cuny_scouter"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
