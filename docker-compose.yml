services:
  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cuny_scouter
      POSTGRES_USER: scouter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scouter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scouter -d cuny_scouter"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      - DATABASE_URL=postgresql://scouter:${POSTGRES_PASSWORD:-scouter}@db:5432/cuny_scouter
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    command: uvicorn cuny_scouter.web:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://scouter:${POSTGRES_PASSWORD:-scouter}@db:5432/cuny_scouter
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: python -m cuny_scouter.scheduler
    environment:
      - DATABASE_URL=postgresql://scouter:${POSTGRES_PASSWORD:-scouter}@db:5432/cuny_scouter
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
