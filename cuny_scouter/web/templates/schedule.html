{% extends "base.html" %}
{% block title %}Schedule Builder — CUNY Course Scouter{% endblock %}

{% block content %}
<div class="schedule-layout">

  {# ── Left sidebar ── #}
  <div class="schedule-sidebar">
    <div class="sched-sidebar-header">
      <h2>My Classes</h2>
      <div style="display:flex;align-items:center;gap:0.75rem;">
        <button class="btn" onclick="saveSchedule()">Save</button>
        <span id="save-status" class="save-status"></span>
      </div>
    </div>

    <div class="sched-search-area" id="sched-search-area">
      <form id="schedule-filter-form">
        <input
          class="sched-search-input"
          type="search"
          name="q"
          placeholder="Search to add classes…"
          autocomplete="off"
          hx-get="/schedule/search"
          hx-trigger="input changed delay:300ms, search"
          hx-target="#schedule-search-results"
          hx-include="#schedule-filter-form"
          hx-swap="innerHTML"
          onfocus="openSearch()"
        >
      </form>
      <div id="schedule-search-results" class="sched-search-results"></div>
    </div>

    <div id="schedule-list">
      <div class="sched-empty-placeholder">Use the search above to add sections.</div>
    </div>
  </div>

  {# ── Right pane: weekly grid ── #}
  <div class="schedule-grid-pane" id="schedule-grid">
    <div class="sched-empty">Add sections from the search to build your schedule.</div>
  </div>

</div>

<script>
  const _savedIds = {{ saved_ids_json | safe }};

  function getSchedule() {
    return JSON.parse(localStorage.getItem('schedule') || '[]');
  }

  function setSchedule(ids) {
    localStorage.setItem('schedule', JSON.stringify(ids));
  }

  function refreshGrid(ids) {
    const params = ids.length ? ids.map(id => 'ids=' + encodeURIComponent(id)).join('&') : '';
    htmx.ajax('GET', '/schedule/grid' + (params ? '?' + params : ''), {
      target: '#schedule-grid',
      swap: 'innerHTML'
    });
  }

  function toggleSchedule(btn, cn) {
    let schedule = getSchedule();
    const inSchedule = schedule.includes(cn);
    if (inSchedule) {
      schedule = schedule.filter(id => id !== cn);
    } else {
      schedule.push(cn);
    }
    setSchedule(schedule);
    updateAddButton(btn, !inSchedule);
    refreshGrid(schedule);
    document.getElementById('save-status').textContent = '';
    closeSearch();
    document.querySelector('.sched-search-input').value = '';
    htmx.ajax('GET', '/schedule/search', { target: '#schedule-search-results', swap: 'innerHTML' });
  }

  function removeFromSchedule(cn) {
    let schedule = getSchedule().filter(id => id !== cn);
    setSchedule(schedule);
    refreshGrid(schedule);
    document.getElementById('save-status').textContent = '';
  }

  function updateAddButton(btn, inSchedule) {
    if (!btn) return;
    btn.textContent = inSchedule ? 'Remove' : 'Add';
  }

  function openSearch() {
    document.getElementById('sched-search-area').classList.add('is-open');
  }

  function closeSearch() {
    document.getElementById('sched-search-area').classList.remove('is-open');
  }

  document.addEventListener('click', function(e) {
    const area = document.getElementById('sched-search-area');
    if (area && !area.contains(e.target)) closeSearch();
  });

  async function saveSchedule() {
    const ids = getSchedule();
    const statusEl = document.getElementById('save-status');
    statusEl.textContent = 'Saving…';
    const fd = new FormData();
    ids.forEach(id => fd.append('ids', id));
    const resp = await fetch('/schedule/save', { method: 'POST', body: fd });
    statusEl.innerHTML = await resp.text();
  }

  if (!localStorage.getItem('schedule') && _savedIds.length > 0) {
    setSchedule(_savedIds);
  }

  const _initSchedule = getSchedule();
  if (_initSchedule.length > 0) {
    refreshGrid(_initSchedule);
  }

  document.addEventListener('htmx:afterSwap', function(e) {
    if (e.detail.target && e.detail.target.id === 'schedule-search-results') {
      const results = e.detail.target;
      if (results.children.length > 0 && results.querySelector('.sched-dropdown-item')) {
        openSearch();
      }
    }
  });
</script>
{% endblock %}
