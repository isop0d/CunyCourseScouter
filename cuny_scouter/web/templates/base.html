<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CUNY Course Scouter{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Theme tokens ── */
    :root {
      --bg:            #eff2f7;   /* gray page canvas */
      --bg-alt:        #ffffff;   /* white — cards, header, table cells */
      --bg-stripe:     #f0f4fb;   /* light blue-gray even-row tint */
      --border:        #dce0ea;   /* blue-tinted gray border */
      --border-strong: #5383e8;   /* op.gg blue accent */
      --text:          #202232;
      --text-muted:    #7b8ab8;
      --text-head:     #4a5070;
      --btn-bg:        #ffffff;
      --btn-hover:     #eef1f8;   /* light blue hover */
      --input-bg:      #ffffff;
    }

    html.dark {
      --bg:            #1a1b2e;   /* dark navy canvas */
      --bg-alt:        #252740;   /* card / header / table cells */
      --bg-stripe:     #2b2e4a;   /* even-row tint */
      --border:        #3a3e62;   /* visible blue-gray border */
      --border-strong: #5383e8;   /* op.gg blue accent */
      --text:          #c8cde6;   /* off-white blue text */
      --text-muted:    #7b82aa;
      --text-head:     #959ec0;
      --btn-bg:        #252740;
      --btn-hover:     #313560;
      --input-bg:      #252740;
    }

    @media (prefers-color-scheme: dark) {
      html:not(.light) {
        --bg:            #1a1b2e;
        --bg-alt:        #252740;
        --bg-stripe:     #2b2e4a;
        --border:        #3a3e62;
        --border-strong: #5383e8;
        --text:          #c8cde6;
        --text-muted:    #7b82aa;
        --text-head:     #959ec0;
        --btn-bg:        #252740;
        --btn-hover:     #313560;
        --input-bg:      #252740;
      }
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-alt);
    }

    header .logo { font-weight: 700; font-size: 1rem; color: var(--text); text-decoration: none; }
    header nav { display: flex; gap: 1.25rem; align-items: center; font-size: 0.85rem; }
    header nav a { color: var(--text); text-decoration: none; }
    header nav a:hover { text-decoration: underline; }
    header nav span { color: var(--text-muted); }

    #theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      font-family: inherit;
    }
    #theme-toggle:hover { color: var(--text); border-color: var(--text); }

    main { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1.5rem; }

    /* ── Buttons ── */
    .btn {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--text);
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
    }
    .btn:hover { background: var(--btn-hover); }
    .btn-discord { background: #5865F2; color: #fff; border-color: #5865F2; }
    .btn-discord:hover { background: #4752c4; }
    .btn-watch   { background: var(--border-strong); color: var(--bg); border-color: var(--border-strong); }
    .btn-watch:hover { opacity: 0.8; }
    .btn-unwatch { background: var(--btn-bg); color: var(--text); border-color: var(--border); }
    .btn-unwatch:hover { background: var(--btn-hover); }

    /* ── Filters ── */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      align-items: center;
    }

    .search-input {
      padding: 0.35rem 0.6rem;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      font-family: inherit;
      background: var(--input-bg);
      color: var(--text);
      width: 280px;
    }
    .search-input:focus { outline: 1px solid var(--border-strong); border-color: var(--border-strong); }

    .filter-select {
      padding: 0.35rem 0.6rem;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      font-family: inherit;
      background: var(--input-bg);
      color: var(--text);
      cursor: pointer;
    }
    .filter-select:focus { outline: 1px solid var(--border-strong); }

    /* ── Results ── */
    .result-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.75rem; min-height: 1.2em; }

    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline; color: var(--text-muted); font-size: 0.8rem; }

    /* ── Course groups (unified table, one tbody per course) ── */
    .sections-table { margin-bottom: 1rem; }
    .course-header-row td {
      font-weight: 600;
      font-size: 0.85rem;
      padding: 1.1rem 0.5rem 0.25rem;
      border-left: 3px solid var(--border-strong);
      background: var(--bg-stripe) !important;
      color: var(--text);
      border-bottom: 1px solid var(--border);
    }
    .course-group:first-child .course-header-row td { padding-top: 0.4rem; }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th {
      text-align: left;
      padding: 0.35rem 0.5rem;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      color: var(--text-head);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      background: var(--bg-alt);
    }
    td {
      padding: 0.4rem 0.5rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      background: var(--bg-alt);
    }
    tbody tr:nth-child(even) td { background: var(--bg-stripe); }
    tbody tr:hover td { background: var(--btn-hover); }
    tr:last-child td { border-bottom: none; }

    /* ── Status ── */
    .status-open     { color: #16a34a; font-weight: 600; }
    .status-closed   { color: #dc2626; }
    .status-waitlist { color: #d97706; font-weight: 600; }

    /* ── RMP rating column ── */
    .rmp-link  { color: var(--text); text-decoration: none; font-size: 0.82rem; }
    .rmp-link:hover { text-decoration: underline; }
    .rmp-count { color: var(--text-muted); font-size: 0.75rem; }
    .rmp-ambiguous { color: var(--text-muted); font-size: 0.72rem; margin-left: 0.2rem; }

    /* ── Show more ── */
    #show-more-container { padding: 0.75rem 0; text-align: center; }
    .btn-show-more { font-size: 0.82rem; padding: 0.35rem 1.25rem; }

    /* ── Schedule builder ── */
    .schedule-layout {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 1.5rem;
      align-items: start;
    }
    .schedule-pane { min-width: 0; }
    .search-pane   { min-width: 0; }

    /* Search pane: stack filters full-width */
    .search-pane .filters { flex-direction: column; }
    .search-pane .search-input,
    .search-pane .filter-select { width: 100%; }

    /* Hide low-value columns in the narrow search pane */
    .search-pane .col-mode,
    .search-pane .col-dates,
    .search-pane .col-rmp { display: none; }

    /* Cap search results height so grid and results scroll independently */
    #schedule-search-results { max-height: 65vh; overflow-y: auto; }

    .sched-pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .sched-pane-header h2 { font-size: 0.95rem; font-weight: 600; color: var(--text); }

    .sched-actions { display: flex; align-items: center; gap: 0.75rem; }
    .save-status   { font-size: 0.8rem; color: var(--text-muted); }

    /* Outer wrapper: time-label col + day cols */
    .sched-wrapper {
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .sched-head-row {
      display: grid;
      border-bottom: 1px solid var(--border);
      background: var(--bg-alt);
    }
    .sched-corner {
      border-right: 1px solid var(--border);
      padding: 0.3rem;
    }
    .sched-day-header {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-head);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.3rem 0;
      border-right: 1px solid var(--border);
    }
    .sched-day-header:last-child { border-right: none; }

    .sched-body-row {
      display: grid;
      position: relative;
    }
    .sched-time-col {
      position: relative;
      border-right: 1px solid var(--border);
    }
    .sched-hour-label {
      position: absolute;
      right: 4px;
      font-size: 0.65rem;
      color: var(--text-muted);
      transform: translateY(-50%);
      white-space: nowrap;
    }

    .sched-day-col {
      position: relative;
      border-right: 1px solid var(--border);
    }
    .sched-day-col:last-child { border-right: none; }

    .sched-hour-line {
      position: absolute;
      left: 0; right: 0;
      border-top: 1px solid var(--border);
      pointer-events: none;
    }

    .sched-event {
      position: absolute;
      border: 1px solid var(--border-strong);
      background: var(--bg-alt);
      overflow: hidden;
      font-size: 0.68rem;
      padding: 0.2rem 0.3rem;
      line-height: 1.3;
      box-sizing: border-box;
    }
    .sched-event.sched-conflict {
      border-color: #d97706;
    }
    .sched-event-code  { font-weight: 600; color: var(--text); }
    .sched-event-room  { color: var(--text-muted); }
    .sched-event-instr { color: var(--text-muted); }
    .sched-conflict-warn { color: #d97706; font-size: 0.62rem; margin-top: 0.1rem; }

    .sched-empty {
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 2rem 0;
      text-align: center;
    }

    /* Unscheduled strip */
    .sched-unscheduled {
      border: 1px solid var(--border);
      border-top: none;
      padding: 0.5rem;
    }
    .sched-unscheduled-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.4rem;
    }
    .sched-unscheduled-items { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .sched-unscheduled-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border: 1px solid var(--border);
      padding: 0.25rem 0.5rem;
      font-size: 0.78rem;
      background: var(--bg);
    }

    /* Add-to-schedule button */
    .btn-add-schedule  { background: var(--btn-bg); color: var(--text); border-color: var(--border); }
    .btn-add-schedule:hover { background: var(--btn-hover); }
    .btn-in-schedule { background: var(--border-strong); color: var(--bg); border-color: var(--border-strong); }
    .btn-in-schedule:hover { opacity: 0.8; }

    @media (max-width: 900px) {
      .schedule-layout { grid-template-columns: 1fr; }
      /* On mobile, search pane filters go back to wrapping row */
      .search-pane .filters { flex-direction: row; flex-wrap: wrap; }
      .search-pane .search-input,
      .search-pane .filter-select { width: auto; }
      #schedule-search-results { max-height: none; }
    }

    @media (max-width: 640px) {
      .search-input { width: 100%; }
      .filters { flex-direction: column; align-items: stretch; }
      .filter-select { width: 100%; }

      header { padding: 0.5rem 1rem; }
      header nav { gap: 0.75rem; flex-wrap: wrap; }
      header nav .username { display: none; }
      main { padding: 1rem; }

      table thead { display: none; }
      table, tbody { display: block; width: 100%; }
      tr {
        display: block;
        border: 1px solid var(--border);
        border-radius: 4px;
        margin-bottom: 0.75rem;
        overflow: hidden;
      }
      td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.45rem 0.75rem;
        border-bottom: 1px solid var(--border);
        background: var(--bg) !important;
      }
      tr:last-child td { border-bottom: 1px solid var(--border); }
      td:last-child { border-bottom: none; }
      td::before {
        content: attr(data-label);
        color: var(--text-muted);
        font-size: 0.72rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        flex-shrink: 0;
        margin-right: 1rem;
      }
      td[data-label=""] { justify-content: flex-end; }
      td[data-label=""]::before { display: none; }

      /* Course header rows: flat label, not a card */
      .course-header-row {
        border: none;
        border-radius: 0;
        margin-bottom: 0;
      }
      .course-header-row td {
        display: block;
        border: none;
        border-left: 3px solid var(--border-strong);
        padding: 0.6rem 0.75rem 0.25rem;
        background: var(--bg-stripe) !important;
      }
      .course-header-row td::before { display: none; }

      .col-mode, .col-dates, .col-section, .col-rmp { display: none; }
    }
  </style>
  <script>
    (function () {
      const stored = localStorage.getItem('theme');
      if (stored === 'light') document.documentElement.classList.add('light');
      else document.documentElement.classList.add('dark');
    })();
  </script>
</head>
<body>
  <header>
    <a href="/" class="logo">CUNY Course Scouter</a>
    <nav>
      <a href="/schedule">Schedule</a>
      {% if student %}
        <a href="/me">My Watches</a>
        <span class="username">{{ student.discord_username }}</span>
        <a href="/logout">Logout</a>
      {% else %}
        <a href="/auth/discord" class="btn btn-discord">Login with Discord</a>
      {% endif %}
      <button id="theme-toggle" onclick="toggleTheme()">Dark / Light</button>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.contains('dark') ||
        (!html.classList.contains('light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) {
        html.classList.remove('dark');
        html.classList.add('light');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.remove('light');
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    }
  </script>
</body>
</html>
