<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CUNY Course Scouter{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Theme tokens ── */
    :root {
      --bg:        #ffffff;
      --bg-alt:    #f7f7f7;
      --bg-stripe: #f2f2f2;
      --border:    #ddd;
      --border-strong: #111;
      --text:      #111;
      --text-muted:#666;
      --text-head: #444;
      --btn-bg:    #ffffff;
      --btn-hover: #f0f0f0;
      --input-bg:  #ffffff;
    }

    html.dark {
      --bg:            #13151b;
      --bg-alt:        #1a1f2e;
      --bg-stripe:     #1e2438;
      --border:        #2c3254;
      --border-strong: #5383e8;
      --text:          #e8eaf0;
      --text-muted:    #7b8ab8;
      --text-head:     #9eafd4;
      --btn-bg:        #1a1f2e;
      --btn-hover:     #252d45;
      --input-bg:      #1a1f2e;
    }

    @media (prefers-color-scheme: dark) {
      html:not(.light) {
        --bg:            #13151b;
        --bg-alt:        #1a1f2e;
        --bg-stripe:     #1e2438;
        --border:        #2c3254;
        --border-strong: #5383e8;
        --text:          #e8eaf0;
        --text-muted:    #7b8ab8;
        --text-head:     #9eafd4;
        --btn-bg:        #1a1f2e;
        --btn-hover:     #252d45;
        --input-bg:      #1a1f2e;
      }
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
    }

    header .logo { font-weight: 700; font-size: 1rem; color: var(--text); text-decoration: none; }
    header nav { display: flex; gap: 1.25rem; align-items: center; font-size: 0.85rem; }
    header nav a { color: var(--text); text-decoration: none; }
    header nav a:hover { text-decoration: underline; }
    header nav span { color: var(--text-muted); }

    #theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      font-family: inherit;
    }
    #theme-toggle:hover { color: var(--text); border-color: var(--text); }

    main { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1.5rem; }

    /* ── Buttons ── */
    .btn {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--text);
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
    }
    .btn:hover { background: var(--btn-hover); }
    .btn-discord { background: #5865F2; color: #fff; border-color: #5865F2; }
    .btn-discord:hover { background: #4752c4; }
    .btn-watch   { background: var(--border-strong); color: var(--bg); border-color: var(--border-strong); }
    .btn-watch:hover { opacity: 0.8; }
    .btn-unwatch { background: var(--btn-bg); color: var(--text); border-color: var(--border); }
    .btn-unwatch:hover { background: var(--btn-hover); }

    /* ── Filters ── */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      align-items: center;
    }

    .search-input {
      padding: 0.35rem 0.6rem;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      font-family: inherit;
      background: var(--input-bg);
      color: var(--text);
      width: 280px;
    }
    .search-input:focus { outline: 1px solid var(--border-strong); border-color: var(--border-strong); }

    .filter-select {
      padding: 0.35rem 0.6rem;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      font-family: inherit;
      background: var(--input-bg);
      color: var(--text);
      cursor: pointer;
    }
    .filter-select:focus { outline: 1px solid var(--border-strong); }

    /* ── Results ── */
    .result-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.75rem; min-height: 1.2em; }

    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline; color: var(--text-muted); font-size: 0.8rem; }

    /* ── Course blocks ── */
    .course-block { margin-bottom: 1.75rem; }
    .course-header {
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.4rem 0.5rem;
      border-left: 3px solid var(--border-strong);
      background: var(--bg-alt);
      color: var(--text);
      margin-bottom: 0;
    }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th {
      text-align: left;
      padding: 0.35rem 0.5rem;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      color: var(--text-head);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      background: var(--bg);
    }
    td {
      padding: 0.4rem 0.5rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      background: var(--bg);
    }
    tbody tr:nth-child(even) td { background: var(--bg-stripe); }
    tbody tr:hover td { background: var(--bg-alt); }
    tr:last-child td { border-bottom: none; }

    /* ── Status ── */
    .status-open     { color: #16a34a; font-weight: 600; }
    .status-closed   { color: #dc2626; }
    .status-waitlist { color: #d97706; font-weight: 600; }

    @media (max-width: 640px) {
      .search-input { width: 100%; }
      .filters { flex-direction: column; align-items: stretch; }
      .filter-select { width: 100%; }

      header { padding: 0.5rem 1rem; }
      header nav { gap: 0.75rem; flex-wrap: wrap; }
      header nav .username { display: none; }
      main { padding: 1rem; }

      table thead { display: none; }
      table, tbody { display: block; width: 100%; }
      tr {
        display: block;
        border: 1px solid var(--border);
        border-radius: 4px;
        margin-bottom: 0.75rem;
        overflow: hidden;
      }
      td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.45rem 0.75rem;
        border-bottom: 1px solid var(--border);
        background: var(--bg) !important;
      }
      tr:last-child td { border-bottom: 1px solid var(--border); }
      td:last-child { border-bottom: none; }
      td::before {
        content: attr(data-label);
        color: var(--text-muted);
        font-size: 0.72rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        flex-shrink: 0;
        margin-right: 1rem;
      }
      td[data-label=""] { justify-content: flex-end; }
      td[data-label=""]::before { display: none; }

      .col-mode, .col-dates, .col-section { display: none; }
    }
  </style>
  <script>
    (function () {
      const stored = localStorage.getItem('theme');
      if (stored === 'light') document.documentElement.classList.add('light');
      else document.documentElement.classList.add('dark');
    })();
  </script>
</head>
<body>
  <header>
    <a href="/" class="logo">CUNY Course Scouter</a>
    <nav>
      {% if student %}
        <a href="/me">My Watches</a>
        <span class="username">{{ student.discord_username }}</span>
        <a href="/logout">Logout</a>
      {% else %}
        <a href="/auth/discord" class="btn btn-discord">Login with Discord</a>
      {% endif %}
      <button id="theme-toggle" onclick="toggleTheme()">Dark / Light</button>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.contains('dark') ||
        (!html.classList.contains('light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) {
        html.classList.remove('dark');
        html.classList.add('light');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.remove('light');
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    }
  </script>
</body>
</html>
